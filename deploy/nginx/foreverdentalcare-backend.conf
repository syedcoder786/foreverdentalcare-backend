# Nginx reverse proxy for the backend. Installed on the server as
# /etc/nginx/sites-available/foreverdentalcare-backend (symlinked into sites-enabled).
# When you have a domain, replace server_name and run: sudo certbot --nginx -d api.your-domain.com
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    client_max_body_size 6m;   # image uploads are limited to 5 MB by the backend

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location = /actuator/health {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
    }

    location / {
        return 404;
    }
}
