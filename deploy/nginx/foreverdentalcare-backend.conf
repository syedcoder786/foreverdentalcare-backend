# Nginx reverse proxy for the backend. Installed on the server as
# /etc/nginx/sites-available/foreverdentalcare-backend (symlinked into sites-enabled).
# When you have a domain, replace server_name and run: sudo certbot --nginx -d api.your-domain.com

# Real visitor IP for rate limiting. The frontend on Vercel forwards /api here, so the connecting address is a Vercel
# server; Vercel puts the visitor's IP first in X-Forwarded-For. Pass only that first IP on (Spring trusts the header
# because nginx connects from the Docker network). Direct requests without the header use the connecting address.
map $http_x_forwarded_for $client_ip {
    "~^\s*(?<first_ip>[0-9a-fA-F:.]+)" $first_ip;
    default                            $remote_addr;
}

# Vercel connects over http but the visitor used https; keep the original scheme when Vercel reports it.
map $http_x_forwarded_proto $forwarded_proto {
    "~^(https|http)$" $http_x_forwarded_proto;
    default           $scheme;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    client_max_body_size 6m;   # image uploads are limited to 5 MB by the backend

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $client_ip;
        proxy_set_header X-Forwarded-For   $client_ip;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 60s;
    }

    location = /actuator/health {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
    }

    location / {
        return 404;
    }
}
