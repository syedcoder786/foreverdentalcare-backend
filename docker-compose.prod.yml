# Production stack: the backend container. The database is Supabase (DB_* in .env).
# Nginx runs on the host and proxies to 127.0.0.1:8080.
# Usage on the server (next to a filled-in .env):  docker compose -f docker-compose.prod.yml up -d
services:
  backend:
    image: foreverdentalcare-backend:latest
    build: .
    container_name: dental-clinic-backend
    restart: unless-stopped
    env_file: .env
    environment:
      SERVER_PORT: "8080"
      FORWARD_HEADERS_STRATEGY: native
    # Only reachable from the host itself; the public goes through Nginx.
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - backend_data:/app/data
    mem_limit: 512m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  backend_data:
