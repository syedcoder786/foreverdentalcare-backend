# All secrets and environment-specific values come from environment variables.
# For local development, put them in backend/.env (git-ignored); it is imported below.
spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: dental-clinic-backend
  # PostgreSQL (Supabase). The clinic tables live in DB_SCHEMA; "extensions" is where Supabase installs extensions
  # such as btree_gist. For Supabase use the Session pooler host (IPv4), not the direct db.<ref>.supabase.co host.
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME:postgres}?sslmode=${DB_SSL_MODE:require}&currentSchema=${DB_SCHEMA:dental_clinic},extensions,public
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    # Note: do NOT set hibernate.jdbc.time_zone - it would also shift LocalDate/LocalTime wall-clock values.
    # Instants (createdAt/updatedAt) are always normalised to UTC by Hibernate 6.
  flyway:
    enabled: true
    # Shared migrations + vendor-specific ones (e.g. the PostgreSQL exclusion constraint).
    locations: classpath:db/migration,classpath:db/vendor/{vendor}
  servlet:
    multipart:
      max-file-size: ${UPLOAD_MAX_FILE_SIZE:5MB}
      max-request-size: ${UPLOAD_MAX_FILE_SIZE:5MB}
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
    time-zone: UTC

server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:none}
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health

app:
  timezone: ${APP_TIMEZONE:Asia/Kolkata}
  database:
    # Schema of the DB_* database that holds the clinic tables; Flyway creates it on first start.
    schema: ${DB_SCHEMA:dental_clinic}
    pool-size: ${DB_POOL_SIZE:5}
    # Another Supabase database chosen in Admin -> Database (test, connect, copy data) is saved here and overrides the
    # DB_* settings. Contains the database password: keep it out of git. "Go back to .env database" deletes it.
    config-file: ${DB_CONFIG_FILE:./db-connection.json}
  storage:
    # "local" stores files on disk under upload-dir; "cloudinary" uploads them to Cloudinary (needs CLOUDINARY_URL).
    provider: ${STORAGE_PROVIDER:local}
    # Storage chosen in Admin -> Image storage is saved here and overrides provider / cloudinary below.
    # Contains the Cloudinary API secret: keep it out of git. Delete the file to go back to the settings below.
    config-file: ${STORAGE_CONFIG_FILE:./storage-connection.json}
    upload-dir: ${UPLOAD_DIR:./uploads}
    max-file-size-bytes: ${UPLOAD_MAX_BYTES:5242880}
    cloudinary:
      # cloudinary://<api_key>:<api_secret>@<cloud_name> - a secret, keep it in backend/.env only.
      url: ${CLOUDINARY_URL:}
      folder: ${CLOUDINARY_FOLDER:forever-dental-care}
  # Patient sign-in with a WhatsApp code. WhatsApp credentials are set in Admin -> Settings -> WhatsApp sign-in.
  patient-auth:
    # DEVELOPMENT ONLY: while WhatsApp is not set up, write sign-in codes to the server log. Never enable in production.
    log-otp-codes: ${OTP_LOG_CODES:false}
    refresh-token-ttl-days: ${PATIENT_SESSION_DAYS:30}
    whatsapp-api-version: ${WHATSAPP_API_VERSION:v25.0}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  jwt:
    secret: ${JWT_SECRET}
    access-token-ttl-minutes: ${JWT_ACCESS_TTL_MINUTES:15}
    refresh-token-ttl-days: ${JWT_REFRESH_TTL_DAYS:7}
    issuer: dental-clinic
  cookie:
    secure: ${COOKIE_SECURE:true}
    same-site: ${COOKIE_SAME_SITE:Strict}
  admin-bootstrap:
    name: ${ADMIN_NAME:Clinic Admin}
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
  rate-limit:
    booking-per-hour: ${RATE_LIMIT_BOOKING_PER_HOUR:10}
    login-per-minute: ${RATE_LIMIT_LOGIN_PER_MINUTE:5}
    refresh-per-minute: ${RATE_LIMIT_REFRESH_PER_MINUTE:30}
