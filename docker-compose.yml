services:
  postgres:
    image: postgres:16-alpine
    container_name: dental-clinic-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-dental_clinic}
      POSTGRES_USER: ${DB_USERNAME:-dental_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      TZ: UTC
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - dental_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-dental_user} -d ${DB_NAME:-dental_clinic}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  dental_pgdata:
